min_version = "2024.12.0"

[tools]
go = "1.26.1"
golangci-lint = "2.11.2"

[env]
# Module path used for -ldflags -X version injection (see build, build:linux).
GDU_PKG = "github.com/dundee/gdu/v5"

# --- Build & install -------------------------------------------------------

[tasks.build]
description = "Build dist/gdu with version info baked in"
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go", "pkg/**/*.go", "tui/**/*.go", "stdout/**/*.go", "report/**/*.go", "default.pgo"]
outputs = ["dist/gdu"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$(git describe --tags 2>/dev/null || echo dev)"
ldflags="-s -w \
  -X ${GDU_PKG}/build.Version=${version} \
  -X ${GDU_PKG}/build.User=$(id -u -n) \
  -X ${GDU_PKG}/build.Time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
mkdir -p dist
CGO_ENABLED=0 go build -trimpath -mod=readonly -pgo=default.pgo \
  -ldflags="${ldflags}" -o dist/gdu ./cmd/gdu
echo "built dist/gdu (${version})"
'''

# Cross-build. CGO is already off in `build`, so this is a plain GOOS/GOARCH
# swap with no toolchain needed. ldflags are duplicated from `build` rather than
# shared: `build` is cached on dist/gdu, and reusing it under a different -o
# would let a fresh dist/gdu skip a cross-build that never ran.
[tasks."build:linux"]
description = "Cross-build static Linux binaries for deploying from macOS"
usage = '''
arg "<arch>" help="comma-separated GOARCH list" default="amd64,arm64"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$(git describe --tags 2>/dev/null || echo dev)"
ldflags="-s -w \
  -X ${GDU_PKG}/build.Version=${version} \
  -X ${GDU_PKG}/build.User=$(id -u -n) \
  -X ${GDU_PKG}/build.Time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
supported="$(go tool dist list | grep '^linux/' | cut -d/ -f2)"
mkdir -p dist
IFS=',' read -ra arches <<< "${usage_arch}"
for arch in "${arches[@]}"; do
  arch="${arch// /}"
  if ! grep -qx "${arch}" <<< "${supported}"; then
    echo "error: linux/${arch} is not a valid target; supported: $(tr '\n' ' ' <<< "${supported}")" >&2
    exit 1
  fi
  out="dist/gdu_linux_${arch}"
  CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -mod=readonly -pgo=default.pgo \
    -ldflags="${ldflags}" -o "${out}" ./cmd/gdu
  echo "built ${out} (${version}, linux/${arch})"
done
'''

# Installs as `gdu-go` to avoid clashing with coreutils' `gdu` (GNU du) on
# Homebrew. Overrides: GDU_BIN=gdu / GDU_INSTALL_DIR=/usr/local/bin mise run cli:install
# Not named `install`: `mise install` is the builtin tool installer and wins.
# Default ~/.local/bin avoids `go install`, whose GOBIN mise overrides to its
# own throwaway toolchain sandbox (~/.local/share/mise/installs/go/.../bin).
[tasks."cli:install"]
description = "Build, then install as gdu-go into ~/.local/bin for use anywhere"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
dest="${GDU_INSTALL_DIR:-$HOME/.local/bin}"
name="${GDU_BIN:-gdu-go}"
mkdir -p "${dest}"
install -m 0755 dist/gdu "${dest}/${name}"
echo "installed -> ${dest}/${name} ($(./dist/gdu --version | head -1 | tr -s ' '))"
case ":$PATH:" in *":${dest}:"*) ;; *) echo "warning: ${dest} is not on \$PATH" ;; esac
'''

[tasks.dev]
description = "Run gdu from source (args after --, e.g. mise run dev -- -npc ~)"
run = "go run ./cmd/gdu"

# --- Quality gates ---------------------------------------------------------

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:cover"]
description = "Run tests with race detector and write coverage.out"
sources = ["**/*.go"]
outputs = ["coverage.out"]
run = [
  "go test -race -covermode=atomic -coverprofile=coverage.out ./...",
  "go tool cover -func=coverage.out | tail -1",
]

# golangci-lint covers go vet (govet) and gofmt/goimports (formatters), so
# there is no separate vet or fmt:check task.
[tasks.lint]
description = "Lint and check formatting (read-only)"
run = "golangci-lint run -c .golangci.yml"

[tasks."lint:fix"]
description = "Lint with autofix (rewrites files)"
run = "golangci-lint run -c .golangci.yml --fix"

# Call as `mise run fmt`: bare `mise fmt` is the builtin mise.toml formatter.
[tasks.fmt]
description = "Format code with gofmt + goimports (rewrites files)"
run = "golangci-lint fmt -c .golangci.yml"

[tasks.ci]
description = "Gate before claiming done: lint + test (read-only)"
depends = ["lint", "test"]

# --- Setup -----------------------------------------------------------------

[tasks.setup]
description = "One command after cloning: git hooks, then next steps"
run = """
# No local hooksPath when the global ct-hook-dispatch exists (it runs .githooks).
hooks_dir=$(git config --global --get core.hooksPath) || hooks_dir=
case "$hooks_dir" in
  "~") hooks_dir=$HOME ;;
  "~/"*) hooks_dir="$HOME/${hooks_dir#"~/"}" ;;
esac
if [ -n "$hooks_dir" ] && [ -x "$hooks_dir/ct-hook-dispatch" ]; then
  [ "$(git config --local --get core.hooksPath)" = ".githooks" ] && git config --local --unset core.hooksPath
  echo 'git hooks: global dispatcher runs .githooks'
else
  git config core.hooksPath .githooks
fi
echo
echo 'Setup complete. Next:'
echo '  mise run dev     run gdu from source'
echo '  mise run ci      the gate, also runs on pre-commit'
"""

# --- Housekeeping ----------------------------------------------------------

[tasks.clean]
description = "Remove build and coverage artifacts"
run = "rm -rf dist coverage.out coverage.txt coverage.html"
