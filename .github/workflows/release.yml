name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Required for softprops/action-gh-release to create the release; repos whose
    # default GITHUB_TOKEN is read-only fail at the upload step without it.
    permissions:
      contents: write
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run tests
        run: go test -v -covermode=count ./...
      - name: Install tooling
        run: go install github.com/mitchellh/gox@latest
      # Artifacts are published unsigned; sha256sums.txt is the only integrity
      # check. Upstream signs it with a GPG key this fork does not hold.
      - name: Build
        run: |
          set -euo pipefail
          make clean
          make tarball
          make build-all
          make man
          make clean-uncompressed-dist
          cd dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*
          generate_release_notes: true